services:
  warp-sub:
    image: ${WARPSUB_IMAGE:-ghcr.io/your-name/warp-sub:latest}
    container_name: ${WARPSUB_NAME:-warp-sub}
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # 容器内固定监听 8080，宿主机端口由 WARPSUB_PORT 决定
      WARPSUB_DATA_DIR: "/data"
      WARPSUB_STATIC_DIR: "/app/static"
      WARPSUB_CONFIG: "/data/config.yaml"
      TZ: ${TZ:-Asia/Shanghai}

    ports:
      - "${WARPSUB_PORT:-8080}:8080"

    volumes:
      - ./data:/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

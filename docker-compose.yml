services:
  warp-sub:
    image: ghcr.io/sunriseqis/suenwarp:latest
    container_name: warp-sub
    restart: unless-stopped
    environment:
      # 部署时必须给定，未设置则 compose 直接报错退出，不会起一个无鉴权的面板。
      WARPSUB_TOKEN: "${WARPSUB_TOKEN:?部署前必须设置 WARPSUB_TOKEN：cp .env.example .env 并填写}"
    ports:
      # 容器内固定 8080，这里只决定宿主机端口
      - "${WARPSUB_PORT:-8080}:8080"
    volumes:
      - ./data:/data

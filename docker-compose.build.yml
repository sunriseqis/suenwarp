# 本地从源码构建（不走 CI 镜像）
services:
  warp-sub:
    build: .
    image: warpsub:local
    container_name: ${WARPSUB_NAME:-warp-sub}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WARPSUB_LISTEN: ":8080"
      WARPSUB_DATA_DIR: "/data"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WARPSUB_PORT:-8080}:8080"
    volumes:
      - ./data:/data
